<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ログイン</title>
<style>
  :root {
    --bg: #f4f7fb;
    --panel: #ffffff;
    --border: #dfe7f2;
    --text: #1f2937;
    --muted: #6b7280;
    --primary: #2563eb;
    --primary-dark: #1d4ed8;
    --warning-bg: #fff7ed;
    --warning-text: #9a5b00;
    --danger-bg: #fef2f2;
    --danger-text: #b91c1c;
    --shadow: 0 12px 28px rgba(15, 23, 42, 0.08);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 40px 20px;
    background: var(--bg);
    font-family: sans-serif;
    color: var(--text);
  }
  .container {
    max-width: 760px;
    margin: 0 auto;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 18px;
    box-shadow: var(--shadow);
    padding: 28px 24px;
  }
  h2 {
    margin-top: 0;
    margin-bottom: 12px;
  }
  .helper {
    color: var(--muted);
    margin: 0 0 10px;
    line-height: 1.6;
  }
  .notice {
    margin: 18px 0;
    padding: 12px 14px;
    border-radius: 10px;
    background: var(--warning-bg);
    color: var(--warning-text);
    border: 1px solid #fed7aa;
    font-weight: 600;
  }
  .panel {
    background: #f8fafc;
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 16px;
    margin: 18px 0;
  }
  .user-list {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin: 14px 0 0;
  }
  .user-option {
    border: 1px solid var(--border);
    border-radius: 999px;
    background: #ffffff;
    color: var(--text);
    padding: 10px 16px;
    font-size: 0.96rem;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .user-option:hover {
    border-color: var(--primary);
    color: var(--primary);
  }
  .user-option.selected {
    background: #eff6ff;
    border-color: var(--primary);
    color: var(--primary);
    font-weight: 700;
  }
  label {
    display: block;
    font-weight: 600;
    margin-bottom: 8px;
  }
  input {
    width: 100%;
    max-width: 320px;
    padding: 0.8em 0.9em;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 1rem;
    margin-bottom: 16px;
  }
  button {
    border: none;
    border-radius: 10px;
    background: var(--primary);
    color: white;
    padding: 0.8em 1.1em;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.2s ease;
  }
  button:hover { background: var(--primary-dark); }
  #error {
    min-height: 24px;
    color: var(--danger-text);
    margin-top: 14px;
    font-weight: 600;
  }
  .muted-link {
    display: inline-block;
    margin-top: 18px;
    color: var(--primary);
    text-decoration: none;
    font-weight: 600;
  }
  .muted-link:hover { text-decoration: underline; }
  .empty {
    margin: 14px 0 0;
    color: var(--muted);
  }
</style>
</head>
<body>
<script>
  window.DEFAULT_ADMIN_USERNAME = {{ default_admin_username|tojson }};
</script>
<div class="container">
  <h2>ログイン</h2>
  <p class="helper">ユーザーを選んで、端末の指紋/顔認証でログインします。</p>
  <p class="helper">管理者アカウントは初回に Passkey を登録してから使えます。</p>

  {% if registration_disabled %}
    <div class="notice">{{ registration_message }}</div>
  {% endif %}

  <div class="panel">
    {% if users %}
    <div class="user-list" aria-label="登録済みユーザー一覧">
      {% for user in users %}
        <button type="button" class="user-option" data-username="{{ user.username }}">{{ user.username }}</button>
      {% endfor %}
    </div>
    {% else %}
    <p class="empty">まだ登録済みのユーザーがいません。</p>
    {% endif %}
  </div>

  <form id="loginForm">
    <label for="username">ユーザー名</label>
    <input type="text" id="username" list="userList" placeholder="ユーザー名を選択または入力" required>
    <datalist id="userList">
      {% for user in users %}
        <option value="{{ user.username }}">{{ user.username }}</option>
      {% endfor %}
    </datalist>
    <button type="submit">このユーザーでログイン</button>
  </form>
  <div id="error"></div>
</div>

<script src="{{ url_for('static', filename='login.js') }}"></script>
</body>
</html>
