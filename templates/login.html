<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ログイン</title>
<style>
  body { font-family: sans-serif; margin: 2em; }
  input { padding: 0.5em; margin-bottom: 1em; width: 220px; }
  button { padding: 0.5em 1em; cursor: pointer; }
  #error { color: red; margin-top: 1em; }
  .user-list { display: flex; flex-wrap: wrap; gap: 0.5em; margin: 1em 0; }
  .user-option { border: 1px solid #ccc; border-radius: 999px; background: #f5f5f5; }
  .helper { color: #666; margin-bottom: 1em; }
  .muted-link { display: inline-block; margin-top: 1em; }
</style>
</head>
<body>
<h2>ログイン</h2>
<p class="helper">ユーザーを選んで、端末の指紋/顔認証でログインします。</p>

{% if users %}
<div class="user-list" aria-label="登録済みユーザー一覧">
  {% for user in users %}
    <button type="button" class="user-option" data-username="{{ user.username }}">{{ user.username }}</button>
  {% endfor %}
</div>
{% else %}
<p>まだ登録済みのユーザーがいません。</p>
{% endif %}

<form id="loginForm">
  <label for="username">ユーザー名</label><br>
  <input type="text" id="username" list="userList" placeholder="ユーザー名を選択または入力" required>
  <datalist id="userList">
    {% for user in users %}
      <option value="{{ user.username }}">{{ user.username }}</option>
    {% endfor %}
  </datalist>
  <br>
  <button type="submit">このユーザーでログイン</button>
</form>
<div id="error"></div>
<a class="muted-link" href="{{ url_for('auth.register_page') }}">新規ユーザー登録</a>

<script src="{{ url_for('static', filename='login.js') }}"></script>
</body>
</html>
